name: Elevate FB groups

# Dwa rytmy:
#  - pełny przebieg (zbieranie + WhatsApp) 4x dziennie: 9:00, 13:00, 17:00, 21:00 czasu polskiego
#    GitHub liczy w UTC. Latem (CEST, UTC+2) to 07/11/15/19 UTC. Zimą (CET, UTC+1)
#    te same wpisy dadzą 8/12/16/20 czasu polskiego — do korekty przy zmianie czasu.
#  - sprawdzenie odpowiedzi na WhatsAppie i publikacja zaakceptowanych: co 30 minut.
#    ~48 lekkich przebiegów dziennie. Na prywatnym repo to ok. 2-3 tys. minut/mies.,
#    czyli powyżej darmowego limitu — na publicznym repo bez limitu. Można
#    zmienić na */60, jeśli 30 min opóźnienia publikacji nie ma znaczenia.

on:
  schedule:
    - cron: "0 7,11,15,19 * * *"
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "all | publish | harvest"
        default: "all"
        type: choice
        options: [all, publish, harvest]
      dry_run:
        description: "Nic nie wysyłaj i nie publikuj"
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: elevate-fb-groups
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Zależności
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Wybór trybu
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.dry_run }}" = "true" ]; then echo "flags=--dry-run" >> "$GITHUB_OUTPUT"; fi
          elif [ "${{ github.event.schedule }}" = "0 7,11,15,19 * * *" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Przebieg
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
          FB_STORAGE_STATE: ${{ secrets.FB_STORAGE_STATE }}
        run: python run.py ${{ steps.mode.outputs.mode }} ${{ steps.mode.outputs.flags }}

      - name: Zapisz stan do repo
        if: always()
        run: |
          git config user.name "elevate-bot"
          git config user.email "elevate-bot@users.noreply.github.com"
          git add state/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Stan bez zmian."
          else
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ) (${{ steps.mode.outputs.mode }})"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi
